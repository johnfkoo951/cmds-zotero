name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact version tag
        run: node scripts/verify-release.mjs
      - name: Release notes from the CHANGELOG section of the tag
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/sanitize.mjs
      - name: Generated files match the committed ones
        run: git diff --exit-code -- scripts/ingest-core.mjs && node scripts/sync-contract.mjs --check
      - name: Attest all three plugin assets
        id: provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Preserve provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" provenance.jsonl
      - uses: actions/upload-artifact@v6
        with:
          name: cmds-zotero-release
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css
            provenance.jsonl
      - name: Publish release from approved tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" main.js manifest.json styles.css provenance.jsonl
